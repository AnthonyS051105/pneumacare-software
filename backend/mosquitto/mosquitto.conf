# Konfigurasi Mosquitto untuk development lokal PNEUMACARE.
# Sesuai INTEGRATION_CONTRACT.md §3.1 — port 1883 non-TLS, cukup untuk demo di jaringan lokal.
#
# Cara pakai (Mosquitto harus sudah terinstall di sistem, lihat README di folder ini):
#   mosquitto -c mosquitto.conf -v

listener 1883
protocol mqtt

# 🧩 Untuk demo kompetisi: izinkan koneksi anonim dulu (tanpa auth) supaya development cepat.
# INTEGRATION_CONTRACT.md §6 mengusulkan static API key/token (username/password MQTT) sebagai
# baseline sebelum submit final — aktifkan allow_anonymous false + password_file saat itu siap.
allow_anonymous true

persistence true
persistence_location ./data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
