# Konfigurasi Mosquitto untuk development lokal PNEUMACARE.
# Sesuai INTEGRATION_CONTRACT.md §3.1 — port 1883 non-TLS, cukup untuk demo di jaringan lokal.
#
# Cara pakai (Mosquitto harus sudah terinstall di sistem, lihat README di folder ini):
#   mosquitto -c mosquitto.conf -v

listener 1883
protocol mqtt

# Autentikasi baseline sesuai INTEGRATION_CONTRACT.md §6 — static API key/token dikirim
# sebagai username/password MQTT. BUKAN autentikasi kelas produksi (tidak ada rotasi/expiry),
# hanya baseline untuk mencegah publisher asing di jaringan demo. Lihat README.md folder ini
# untuk cara generate password_file.
allow_anonymous false
password_file ./passwd

persistence true
persistence_location ./data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
